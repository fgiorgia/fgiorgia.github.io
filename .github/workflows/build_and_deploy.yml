name: Build and Deploy Personal Website
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build_next:
    name: Build Next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint website
        run: yarn lint:ci

      - name: Build website
        run: yarn build

  deploy_next:
    name: Deploy Next
    needs: build_next
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/v2/out

  build_jekyll:
    name: Build v0 (Jekyll)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ruby and bundler
        run: |
          sudo apt update
          sudo apt install -y ruby ruby-dev build-essential
          # determine user gem dir and export for rest of workflow
          GEMDIR="$(ruby -e 'puts Gem.user_dir')"
          echo "GEM_HOME=$GEMDIR" >> $GITHUB_ENV
          echo "BUNDLE_PATH=$GEMDIR" >> $GITHUB_ENV
          echo "$GEMDIR/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          gem install bundler --no-document --user-install
          cd packages/v0
          make install
      - name: Build the site
        run: |
          echo "Building version $GIT_HASH"
          cd packages/v0 && make build
        env: # Export secret as an environment variable
          GOOGLE_ANALYTICS_GTAG: ${{ secrets.GOOGLE_ANALYTICS_GTAG }}
          PAGES_REPO_NWO: ${{ github.repository }}
          GIT_HASH: ${{ github.sha }}

  dependabot-automerge:
    needs: [build_next, build_jekyll]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
